name: jstack-session
run-name: ${{ inputs.role }} session for ${{ inputs.issue }} at ${{ inputs.node }}
on:
  workflow_dispatch:
    inputs:
      role:
        required: true
      issue:
        required: true
      run:
        required: false
      node:
        required: false
      check:
        required: false
      machine:
        required: false
permissions: {}
jobs:
  session:
    name: session
    runs-on: ${{ vars.CI_RUNS_ON }}
    environment: ci-release
    permissions: {}
    steps:
      - name: the stand-in session is held at the gate until the step releases main
        run: |
          echo "dispatched"
          sleep 90
